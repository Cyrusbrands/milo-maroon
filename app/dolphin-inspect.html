<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#224b58}canvas{display:block}</style></head><body><script type="module">
import * as T from './vendor/three.module.js';import {GLTFLoader} from './vendor/GLTFLoader.js';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;document.body.append(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color('#224b58');scene.add(new T.HemisphereLight('#e4f2ff','#a98f6c',2.5));const sun=new T.DirectionalLight('#fff1d8',3);sun.position.set(3,5,4);scene.add(sun);const gltf=await new GLTFLoader().loadAsync('./models/Dolphin-Rigged.glb');scene.add(gltf.scene);gltf.scene.updateMatrixWorld(true);const bounds=new T.Box3().setFromObject(gltf.scene),center=bounds.getCenter(new T.Vector3()),size=bounds.getSize(new T.Vector3());const camera=new T.PerspectiveCamera(35,innerWidth/innerHeight,.01,100);camera.position.copy(center).add(new T.Vector3(size.length()*1.1,size.length()*.4,size.length()*1.8));camera.lookAt(center);renderer.render(scene,camera);window.rigInspect={size:[...size],center:[...center],bounds:{min:[...bounds.min],max:[...bounds.max]},bones:[]};gltf.scene.traverse(o=>{if(o.isBone)rigInspect.bones.push({name:o.name,pos:[...o.getWorldPosition(new T.Vector3())],quat:[...o.getWorldQuaternion(new T.Quaternion())],parent:o.parent.name});});window.rigScene={scene,model:gltf.scene,camera,renderer,T};
</script></body></html>
