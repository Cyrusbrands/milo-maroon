name: Source and native build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run check
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build native/Castaway.Modern.csproj -c Release -r win-x64

      - name: Screensaver name and registration regression
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File qa/screensaver-registration-check.ps1 -ScreenSaverPath native/bin/Release/net10.0-windows/win-x64/Castaway.Modern.exe
